<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resse.ai — Talking Receptionist POC</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #e9e9ec;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 24px;
    }

    .avatar-container {
      position: relative;
      width: 100%;
      max-width: 400px;
      aspect-ratio: 9 / 16;
      background-color: #111;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,0.18);
    }

    .avatar-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.2s ease-in-out;
    }

    #base-player { z-index: 1; opacity: 1; }
    #action-player { z-index: 2; opacity: 0; }

    .controls {
      display: flex;
      gap: 12px;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #2f6fed;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      background: #9fb6ea;
      cursor: not-allowed;
    }

    button.secondary {
      background: #565a63;
    }

    .status {
      font-size: 13px;
      color: #555;
    }
  </style>
</head>
<body>

  <div class="avatar-container">
    <video id="base-player" class="avatar-video" autoplay loop muted playsinline></video>
    <video id="action-player" class="avatar-video" muted playsinline></video>
  </div>

  <div class="controls">
    <button id="talk-btn">Talk</button>
    <button id="idle-btn" class="secondary">Back to Idle</button>
  </div>

  <div class="status" id="status">state: idle</div>

  <script>
    const VIDEO_ASSETS = {
      idle: 'idle.mp4',
      talking: 'talking.mp4'
    };

    const basePlayer = document.getElementById('base-player');
    const actionPlayer = document.getElementById('action-player');
    const statusEl = document.getElementById('status');
    const talkBtn = document.getElementById('talk-btn');
    const idleBtn = document.getElementById('idle-btn');

    let currentState = 'idle';

    function setStatus(state) {
      currentState = state;
      statusEl.textContent = `state: ${state}`;
    }

    function initAvatar() {
      basePlayer.src = VIDEO_ASSETS.idle;
      basePlayer.play().catch(err => console.log('Autoplay blocked, waiting for user interaction:', err));
      setStatus('idle');
    }

    function goIdle() {
      if (currentState === 'idle') return;
      actionPlayer.style.opacity = '0';
      basePlayer.currentTime = 0;
      basePlayer.play();
      setTimeout(() => {
        actionPlayer.pause();
        actionPlayer.removeAttribute('src');
        actionPlayer.load();
      }, 200);
      talkBtn.disabled = false;
      setStatus('idle');
    }

    function goTalking() {
      if (currentState === 'talking') return;
      talkBtn.disabled = true;
      actionPlayer.src = VIDEO_ASSETS.talking;
      actionPlayer.loop = false;
      actionPlayer.currentTime = 0;

      actionPlayer.onloadeddata = () => {
        actionPlayer.play().then(() => {
          actionPlayer.style.opacity = '1';
        });
      };

      actionPlayer.onended = () => {
        goIdle();
      };

      setStatus('talking');
    }

    talkBtn.addEventListener('click', goTalking);
    idleBtn.addEventListener('click', goIdle);

    window.addEventListener('DOMContentLoaded', initAvatar);
  </script>

</body>
</html>
